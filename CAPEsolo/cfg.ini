[analysis_directory]
analysis = C:\Users\Public\CAPEsolo\analysis

; GUI theme. Defaults to dark when this section is absent. Restart CAPEsolo to apply.
;[gui]
;theme = light

; Enable the Start panel's "Download by hash" feature. Default false (no startup prompt). When
; true, CAPEsolo prompts once at startup for a password and/or API keys. "directory" is where
; downloaded samples are saved; it defaults to the user's Desktop when unset.
;[download]
;enabled = true
;directory = C:\Users\Public\downloads

; API keys for the Start panel's "Download by hash" feature, stored ENCRYPTED. Produce each
; blob OFF the VM with tools/encrypt_api_key.py (encrypt every provider you use with the SAME
; password), then paste it here or set CAPESOLO_MB_APIKEY_ENC / CAPESOLO_VT_APIKEY_ENC (env
; wins). CAPEsolo prompts for the password once at startup to decrypt them. MalwareBazaar
; needs a free abuse.ch Auth-Key; VirusTotal file downloads need an Enterprise/Intelligence
; key (the free community key cannot download files).
;[malwarebazaar]
;api_key_enc =
;[virustotal]
;api_key_enc =

; This file holds the shipped defaults and is OVERWRITTEN by pip upgrades.
; Put your own settings in C:\Users\Public\CAPEsolo\cfg.ini instead - it overrides this
; file per key, needs only the keys you change, and pip never touches it.
;
; Optional. Defaults are stdio / 127.0.0.1 / 8000 / /mcp when this section is absent.
; Uncomment to reach the MCP server from the host over a host-only VM network.
; Keep the token in the CAPESOLO_MCP_TOKEN environment variable, not in either cfg.ini.
; The server refuses to start unless enabled = true (default false).
;[mcp_server]
;enabled = true
;transport = streamable-http
;host = 192.168.56.10
;port = 8000
;path = /mcp
;allowed_hosts = 192.168.56.10:8000
;allowed_origins =

; Optional. ResultServer limits, all shown with their defaults. The section can be absent.
; The two caps default to 0, meaning disabled, because enforcing either one loses analysis
; data - only set them if you have a specific problem to solve.
;[resultserver]
; Maximum connections handled at once. 0 = unlimited (default), and strongly recommended.
; While the pool is full gevent stops accepting, so connections pile up unaccepted; any
; still queued when the analysis ends are discarded with no artifact, no files.json entry
; and no error - the client never sees a failure either. Measured on this code, 200
; concurrent uploads with shutdown immediately after: pool_size 8 lost ~48, pool_size 0
; lost 0-1. (The residual is connections still in the listen backlog when the listener
; closes; it predates this setting and no pool size avoids it entirely.)
;pool_size = 0
; Seconds a transfer may sit idle before it is dropped. 0 = wait indefinitely (default).
; analysis.log and the BSON behavior log hold one connection for the whole run and are
; legitimately idle while a sample sleeps, so any value below your analysis timeout will
; truncate them.
;idle_timeout = 0
; Bytes stored per uploaded file before the rest is discarded. The file is left intact and
; is marked "truncated" in files.json. This is the receiving-side backstop only - the
; analyzer has its own upload_max_size in analysis.conf (300 MB) which decides what is sent
; in the first place, and that one normally governs. Keep this at or above it, so it fires
; only when the guest does not honour its own limit.
;upload_max_size = 2000000000
; Seconds shutdown waits for in-flight uploads to finish writing. Returns as soon as they
; are done, so this is a ceiling rather than a delay, and raising it costs nothing when
; there is no work outstanding. Do NOT set 0: that kills handlers mid-write, truncating
; whatever was still transferring.
;drain_timeout = 10
